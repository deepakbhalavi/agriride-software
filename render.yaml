services:
  - type: web
    name: agriride-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this in Render dashboard → Environment → DATABASE_URL
                             # Example (Railway MySQL): mysql+pymysql://user:pass@host:port/db
                             # Example (fallback SQLite): sqlite:///./agriride.db
      - key: SECRET_KEY
        value: agriride-super-secret-key-change-in-production-2024
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ALLOWED_ORIGINS
        value: "*"
    plan: free
